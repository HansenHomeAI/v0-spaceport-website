name: CDK Deploy

on:
  push:
    branches: [ main, development, 'agent-*', 'codex/agent-*', ml-development, email-notifications ]
  pull_request:
    branches: [ main ]

concurrency:
  group: cdk-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  resolve_context:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      deployment_class: ${{ steps.resolve_preview_context.outputs.deployment_class }}
      branch_id: ${{ steps.resolve_preview_context.outputs.branch_id }}
      spaceport_stack_name: ${{ steps.resolve_preview_context.outputs.spaceport_stack_name }}
      ml_stack_name: ${{ steps.resolve_preview_context.outputs.ml_stack_name }}
      auth_stack_name: ${{ steps.resolve_preview_context.outputs.auth_stack_name }}
      auth_marker_relative_path: ${{ steps.resolve_auth_mode.outputs.auth_marker_relative_path }}
      auth_opt_in: ${{ steps.resolve_auth_mode.outputs.auth_opt_in }}
      auth_marker_exists: ${{ steps.resolve_auth_mode.outputs.auth_marker_exists }}
      deploy_auth_stack_effective: ${{ steps.resolve_auth_mode.outputs.deploy_auth_stack_effective }}
      auth_deploy_reason: ${{ steps.resolve_auth_mode.outputs.auth_deploy_reason }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Resolve deployment context
        id: resolve_preview_context
        run: |
          set -euo pipefail
          python3 scripts/resolve_preview_context.py --branch "${GITHUB_REF_NAME}" --format shell > /tmp/deploy-context.env
          cat /tmp/deploy-context.env
          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_ENV"
            echo "${key,,}=${value}" >> "$GITHUB_OUTPUT"
          done < /tmp/deploy-context.env

      - name: Resolve auth deploy mode
        id: resolve_auth_mode
        run: |
          set -euo pipefail
          python3 scripts/resolve_auth_deploy_mode.py \
            --branch "${GITHUB_REF_NAME}" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --format shell > /tmp/auth-deploy-mode.env
          cat /tmp/auth-deploy-mode.env
          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_ENV"
            echo "${key,,}=${value}" >> "$GITHUB_OUTPUT"
          done < /tmp/auth-deploy-mode.env

      - name: Summarize deploy mode
        run: |
          {
            echo "### CDK deploy mode"
            echo ""
            echo "- deployment_class: ${DEPLOYMENT_CLASS}"
            echo "- auth_marker_relative_path: ${AUTH_MARKER_RELATIVE_PATH}"
            echo "- auth_opt_in: ${AUTH_OPT_IN}"
            echo "- auth_marker_exists: ${AUTH_MARKER_EXISTS}"
            echo "- deploy_auth_stack_effective: ${DEPLOY_AUTH_STACK_EFFECTIVE}"
            echo "- auth_deploy_reason: ${AUTH_DEPLOY_REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_shared_auth:
    if: github.event_name == 'push' && needs.resolve_context.outputs.deploy_auth_stack_effective == 'true'
    needs: resolve_context
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: ${{ github.ref_name == 'main' && 'auth-production-shared' || 'auth-staging-shared' }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infrastructure/spaceport_cdk
    env:
      AUTH_DEPLOY_REASON: ${{ needs.resolve_context.outputs.auth_deploy_reason }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      STRIPE_SECRET_KEY_TEST: ${{ secrets.STRIPE_SECRET_KEY_STAGING }}
      STRIPE_WEBHOOK_SECRET_STAGING: ${{ secrets.STRIPE_WEBHOOK_SECRET_STAGING }}
      STRIPE_PRICE_SINGLE_STAGING: ${{ secrets.STRIPE_PRICE_SINGLE_STAGING }}
      STRIPE_PRICE_STARTER_STAGING: ${{ secrets.STRIPE_PRICE_STARTER_STAGING }}
      STRIPE_PRICE_GROWTH_STAGING: ${{ secrets.STRIPE_PRICE_GROWTH_STAGING }}
      STRIPE_MODEL_TRAINING_PRICE_STAGING: ${{ secrets.STRIPE_MODEL_TRAINING_PRICE_STAGING }}
      STRIPE_MODEL_HOSTING_PRICE_STAGING: ${{ secrets.STRIPE_MODEL_HOSTING_PRICE_STAGING }}
      STRIPE_SECRET_KEY_PROD: ${{ secrets.STRIPE_SECRET_KEY_PROD }}
      STRIPE_WEBHOOK_SECRET_PROD: ${{ secrets.STRIPE_WEBHOOK_SECRET_PROD }}
      STRIPE_PRICE_SINGLE_PROD: ${{ secrets.STRIPE_PRICE_SINGLE_PROD }}
      STRIPE_PRICE_STARTER_PROD: ${{ secrets.STRIPE_PRICE_STARTER_PROD }}
      STRIPE_PRICE_GROWTH_PROD: ${{ secrets.STRIPE_PRICE_GROWTH_PROD }}
      CDK_DISABLE_BOOTSTRAP_VERSION_CHECK: "1"
      STRIPE_MODEL_TRAINING_PRICE_PROD: ${{ secrets.STRIPE_MODEL_TRAINING_PRICE_PROD }}
      STRIPE_MODEL_HOSTING_PRICE_PROD: ${{ secrets.STRIPE_MODEL_HOSTING_PRICE_PROD }}
      R2_ENDPOINT_STAGING: ${{ secrets.R2_ENDPOINT_STAGING }}
      R2_ACCESS_KEY_ID_STAGING: ${{ secrets.R2_ACCESS_KEY_ID_STAGING }}
      R2_SECRET_ACCESS_KEY_STAGING: ${{ secrets.R2_SECRET_ACCESS_KEY_STAGING }}
      R2_BUCKET_NAME_STAGING: ${{ secrets.R2_BUCKET_NAME_STAGING }}
      R2_REGION_STAGING: ${{ secrets.R2_REGION_STAGING }}
      R2_ENDPOINT_PROD: ${{ secrets.R2_ENDPOINT_PROD }}
      R2_ACCESS_KEY_ID_PROD: ${{ secrets.R2_ACCESS_KEY_ID_PROD }}
      R2_SECRET_ACCESS_KEY_PROD: ${{ secrets.R2_SECRET_ACCESS_KEY_PROD }}
      R2_BUCKET_NAME_PROD: ${{ secrets.R2_BUCKET_NAME_PROD }}
      R2_REGION_PROD: ${{ secrets.R2_REGION_PROD }}
      SPACES_THUMBNAIL_URL: ${{ secrets.SPACES_THUMBNAIL_URL }}
      SPACES_THUMBNAIL_TOKEN: ${{ secrets.SPACES_THUMBNAIL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: infrastructure/spaceport_cdk/requirements.txt

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache npm global packages
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-global-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-global-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aws-cdk-lib==2.89.0 constructs==10.3.0 boto3==1.28.0 --no-deps
          pip install pytest jsii cattrs typeguard typing-extensions publication --no-deps
          pip install -e .
          npm install -g aws-cdk@2.89.0
          cd ../../web && (npm ci || npm install) && (npm run build || true)
          cd -

      - name: Configure AWS credentials (production via OIDC)
        if: github.ref_name == 'main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - name: Configure AWS credentials (staging via access keys)
        if: github.ref_name != 'main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Resolve deployment context
        run: |
          set -euo pipefail
          python3 ../../scripts/resolve_preview_context.py --branch "${GITHUB_REF_NAME}" --format shell > /tmp/deploy-context.env
          cat /tmp/deploy-context.env
          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < /tmp/deploy-context.env

      - name: CDK Bootstrap (if needed)
        run: |
          set -e
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)

          BOOTSTRAP_PARAMETER="/cdk-bootstrap/hnb659fds/version"
          BOOTSTRAP_BUCKET="cdk-hnb659fds-assets-${ACCOUNT}-us-west-2"

          BOOTSTRAP_REQUIRED=0

          if aws ssm get-parameter --name "$BOOTSTRAP_PARAMETER" --region us-west-2 >/dev/null 2>&1; then
            echo "CDK already bootstrapped with default qualifier for account $ACCOUNT (SSM parameter present)"
          else
            echo "Default qualifier parameter missing or inaccessible for account $ACCOUNT."
            BOOTSTRAP_REQUIRED=1

            if aws s3api head-bucket --bucket "$BOOTSTRAP_BUCKET" >/dev/null 2>&1; then
              echo "Bootstrap assets bucket $BOOTSTRAP_BUCKET already exists."
              echo "Removing all object versions from bootstrap bucket before deletion..."

              KEY_MARKER=""
              VERSION_MARKER=""
              while true; do
                if [ -n "$KEY_MARKER" ]; then
                  RESPONSE=$(aws s3api list-object-versions --bucket "$BOOTSTRAP_BUCKET" --key-marker "$KEY_MARKER" --version-id-marker "$VERSION_MARKER")
                else
                  RESPONSE=$(aws s3api list-object-versions --bucket "$BOOTSTRAP_BUCKET")
                fi

                OBJECTS_JSON=$(echo "$RESPONSE" | jq -c '{
                  Objects: (
                    ((.Versions // []) + (.DeleteMarkers // []))
                    | map({Key: .Key, VersionId: .VersionId})
                  )
                }')

                COUNT=$(echo "$OBJECTS_JSON" | jq '.Objects | length')
                if [ "$COUNT" -gt 0 ]; then
                  echo "$OBJECTS_JSON" > /tmp/delete-bootstrap-objects.json
                  aws s3api delete-objects --bucket "$BOOTSTRAP_BUCKET" --delete file:///tmp/delete-bootstrap-objects.json >/dev/null
                fi

                if [ "$(echo "$RESPONSE" | jq -r '.IsTruncated')" != "true" ]; then
                  break
                fi

                KEY_MARKER=$(echo "$RESPONSE" | jq -r '.NextKeyMarker // empty')
                VERSION_MARKER=$(echo "$RESPONSE" | jq -r '.NextVersionIdMarker // empty')

                if [ -z "$KEY_MARKER" ]; then
                  break
                fi
              done
              rm -f /tmp/delete-bootstrap-objects.json

              echo "Deleting bootstrap bucket $BOOTSTRAP_BUCKET..."
              aws s3api delete-bucket --bucket "$BOOTSTRAP_BUCKET" --region us-west-2
            else
              echo "Bootstrap assets bucket $BOOTSTRAP_BUCKET not found."
            fi

            echo "Checking for existing CDK bootstrap stack..."
            if aws cloudformation describe-stacks --stack-name CDKToolkit --region us-west-2 >/dev/null 2>&1; then
              echo "Found existing CDKToolkit stack. Deleting to ensure clean bootstrap with default qualifier..."
              aws cloudformation delete-stack --stack-name CDKToolkit --region us-west-2
              echo "Waiting for stack deletion to complete..."
              aws cloudformation wait stack-delete-complete --stack-name CDKToolkit --region us-west-2
              echo "Existing CDK bootstrap stack deleted successfully"
            fi
          fi

          if [ "$BOOTSTRAP_REQUIRED" -eq 1 ]; then
            echo "Bootstrapping environment $ACCOUNT/us-west-2 with default qualifier resources..."
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "Production bootstrap with OIDC role trust and default qualifier"
              cdk bootstrap aws://$ACCOUNT/us-west-2 \
                --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess \
                --trust arn:aws:iam::$ACCOUNT:role/GithubActionsProdRole
            else
              echo "Development bootstrap with default qualifier"
              cdk bootstrap aws://$ACCOUNT/us-west-2
            fi
          fi

      - name: Verify Bootstrap
        run: |
          set -e
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "Verifying CDK bootstrap for account $ACCOUNT"

          BOOTSTRAP_PARAMETER="/cdk-bootstrap/hnb659fds/version"
          BOOTSTRAP_BUCKET="cdk-hnb659fds-assets-${ACCOUNT}-us-west-2"

          echo "Checking for default qualifier bootstrap artifacts..."
          if aws ssm get-parameter --name "$BOOTSTRAP_PARAMETER" --region us-west-2 >/dev/null 2>&1; then
            echo "✅ CDK bootstrap verified successfully via SSM parameter"
          elif aws s3api head-bucket --bucket "$BOOTSTRAP_BUCKET" >/dev/null 2>&1; then
            echo "✅ CDK bootstrap assets bucket exists; treating environment as bootstrapped"
          else
            echo "❌ Unable to verify CDK bootstrap state (missing SSM parameter and assets bucket)"
            echo "Manual intervention required before continuing deployment"
            exit 1
          fi

      - name: Deploy shared auth stack
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "Deploying shared auth stack because ${AUTH_DEPLOY_REASON}"
          export DEPLOY_AUTH_STACK_OVERRIDE="true"
          cdk deploy "${AUTH_STACK_NAME}" \
            --require-approval never \
            --no-fail-on-empty-changeset \
            --context environment="${CDK_ENVIRONMENT_NAME}" \
            --context branch_name="${GITHUB_REF_NAME}" \
            --context deploy_auth_stack="true" \
            --context lambdaChanged=false \
            --context account=$ACCOUNT \
            --context region=us-west-2

  deploy_application:
    if: github.event_name == 'push' && (needs.deploy_shared_auth.result == 'success' || needs.deploy_shared_auth.result == 'skipped')
    needs: [resolve_context, deploy_shared_auth]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    outputs:
      deployment_class: ${{ needs.resolve_context.outputs.deployment_class }}
      branch_id: ${{ needs.resolve_context.outputs.branch_id }}
      spaceport_stack_name: ${{ needs.resolve_context.outputs.spaceport_stack_name }}
      ml_stack_name: ${{ needs.resolve_context.outputs.ml_stack_name }}
      auth_stack_name: ${{ needs.resolve_context.outputs.auth_stack_name }}
      drone_path_api_url: ${{ steps.publish_outputs.outputs.drone_path_api_url }}
      file_upload_api_url: ${{ steps.publish_outputs.outputs.file_upload_api_url }}
      ml_pipeline_api_url: ${{ steps.publish_outputs.outputs.ml_pipeline_api_url }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infrastructure/spaceport_cdk
    env:
      AUTH_MARKER_RELATIVE_PATH: ${{ needs.resolve_context.outputs.auth_marker_relative_path }}
      AUTH_OPT_IN: ${{ needs.resolve_context.outputs.auth_opt_in }}
      AUTH_MARKER_EXISTS: ${{ needs.resolve_context.outputs.auth_marker_exists }}
      DEPLOY_AUTH_STACK_EFFECTIVE: ${{ needs.resolve_context.outputs.deploy_auth_stack_effective }}
      AUTH_DEPLOY_REASON: ${{ needs.resolve_context.outputs.auth_deploy_reason }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      STRIPE_SECRET_KEY_TEST: ${{ secrets.STRIPE_SECRET_KEY_STAGING }}
      STRIPE_WEBHOOK_SECRET_STAGING: ${{ secrets.STRIPE_WEBHOOK_SECRET_STAGING }}
      STRIPE_PRICE_SINGLE_STAGING: ${{ secrets.STRIPE_PRICE_SINGLE_STAGING }}
      STRIPE_PRICE_STARTER_STAGING: ${{ secrets.STRIPE_PRICE_STARTER_STAGING }}
      STRIPE_PRICE_GROWTH_STAGING: ${{ secrets.STRIPE_PRICE_GROWTH_STAGING }}
      STRIPE_MODEL_TRAINING_PRICE_STAGING: ${{ secrets.STRIPE_MODEL_TRAINING_PRICE_STAGING }}
      STRIPE_MODEL_HOSTING_PRICE_STAGING: ${{ secrets.STRIPE_MODEL_HOSTING_PRICE_STAGING }}
      STRIPE_SECRET_KEY_PROD: ${{ secrets.STRIPE_SECRET_KEY_PROD }}
      STRIPE_WEBHOOK_SECRET_PROD: ${{ secrets.STRIPE_WEBHOOK_SECRET_PROD }}
      STRIPE_PRICE_SINGLE_PROD: ${{ secrets.STRIPE_PRICE_SINGLE_PROD }}
      STRIPE_PRICE_STARTER_PROD: ${{ secrets.STRIPE_PRICE_STARTER_PROD }}
      STRIPE_PRICE_GROWTH_PROD: ${{ secrets.STRIPE_PRICE_GROWTH_PROD }}
      CDK_DISABLE_BOOTSTRAP_VERSION_CHECK: "1"
      STRIPE_MODEL_TRAINING_PRICE_PROD: ${{ secrets.STRIPE_MODEL_TRAINING_PRICE_PROD }}
      STRIPE_MODEL_HOSTING_PRICE_PROD: ${{ secrets.STRIPE_MODEL_HOSTING_PRICE_PROD }}
      R2_ENDPOINT_STAGING: ${{ secrets.R2_ENDPOINT_STAGING }}
      R2_ACCESS_KEY_ID_STAGING: ${{ secrets.R2_ACCESS_KEY_ID_STAGING }}
      R2_SECRET_ACCESS_KEY_STAGING: ${{ secrets.R2_SECRET_ACCESS_KEY_STAGING }}
      R2_BUCKET_NAME_STAGING: ${{ secrets.R2_BUCKET_NAME_STAGING }}
      R2_REGION_STAGING: ${{ secrets.R2_REGION_STAGING }}
      R2_ENDPOINT_PROD: ${{ secrets.R2_ENDPOINT_PROD }}
      R2_ACCESS_KEY_ID_PROD: ${{ secrets.R2_ACCESS_KEY_ID_PROD }}
      R2_SECRET_ACCESS_KEY_PROD: ${{ secrets.R2_SECRET_ACCESS_KEY_PROD }}
      R2_BUCKET_NAME_PROD: ${{ secrets.R2_BUCKET_NAME_PROD }}
      R2_REGION_PROD: ${{ secrets.R2_REGION_PROD }}
      SPACES_THUMBNAIL_URL: ${{ secrets.SPACES_THUMBNAIL_URL }}
      SPACES_THUMBNAIL_TOKEN: ${{ secrets.SPACES_THUMBNAIL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: infrastructure/spaceport_cdk/requirements.txt

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache npm global packages
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-global-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-global-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aws-cdk-lib==2.89.0 constructs==10.3.0 boto3==1.28.0 --no-deps
          pip install pytest jsii cattrs typeguard typing-extensions publication --no-deps
          pip install -e .
          npm install -g aws-cdk@2.89.0
          cd ../../web && (npm ci || npm install) && (npm run build || true)
          cd -

      - name: Configure AWS credentials (production via OIDC)
        if: github.ref_name == 'main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - name: Configure AWS credentials (staging via access keys)
        if: github.ref_name != 'main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Resolve deployment context
        run: |
          set -euo pipefail
          python3 ../../scripts/resolve_preview_context.py --branch "${GITHUB_REF_NAME}" --format shell > /tmp/deploy-context.env
          cat /tmp/deploy-context.env
          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < /tmp/deploy-context.env

      - name: CDK Bootstrap (if needed)
        run: |
          set -e
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)

          BOOTSTRAP_PARAMETER="/cdk-bootstrap/hnb659fds/version"
          BOOTSTRAP_BUCKET="cdk-hnb659fds-assets-${ACCOUNT}-us-west-2"

          BOOTSTRAP_REQUIRED=0

          if aws ssm get-parameter --name "$BOOTSTRAP_PARAMETER" --region us-west-2 >/dev/null 2>&1; then
            echo "CDK already bootstrapped with default qualifier for account $ACCOUNT (SSM parameter present)"
          else
            echo "Default qualifier parameter missing or inaccessible for account $ACCOUNT."
            BOOTSTRAP_REQUIRED=1

            if aws s3api head-bucket --bucket "$BOOTSTRAP_BUCKET" >/dev/null 2>&1; then
              echo "Bootstrap assets bucket $BOOTSTRAP_BUCKET already exists."
              echo "Removing all object versions from bootstrap bucket before deletion..."

              KEY_MARKER=""
              VERSION_MARKER=""
              while true; do
                if [ -n "$KEY_MARKER" ]; then
                  RESPONSE=$(aws s3api list-object-versions --bucket "$BOOTSTRAP_BUCKET" --key-marker "$KEY_MARKER" --version-id-marker "$VERSION_MARKER")
                else
                  RESPONSE=$(aws s3api list-object-versions --bucket "$BOOTSTRAP_BUCKET")
                fi

                OBJECTS_JSON=$(echo "$RESPONSE" | jq -c '{
                  Objects: (
                    ((.Versions // []) + (.DeleteMarkers // []))
                    | map({Key: .Key, VersionId: .VersionId})
                  )
                }')

                COUNT=$(echo "$OBJECTS_JSON" | jq '.Objects | length')
                if [ "$COUNT" -gt 0 ]; then
                  echo "$OBJECTS_JSON" > /tmp/delete-bootstrap-objects.json
                  aws s3api delete-objects --bucket "$BOOTSTRAP_BUCKET" --delete file:///tmp/delete-bootstrap-objects.json >/dev/null
                fi

                if [ "$(echo "$RESPONSE" | jq -r '.IsTruncated')" != "true" ]; then
                  break
                fi

                KEY_MARKER=$(echo "$RESPONSE" | jq -r '.NextKeyMarker // empty')
                VERSION_MARKER=$(echo "$RESPONSE" | jq -r '.NextVersionIdMarker // empty')

                if [ -z "$KEY_MARKER" ]; then
                  break
                fi
              done
              rm -f /tmp/delete-bootstrap-objects.json

              echo "Deleting bootstrap bucket $BOOTSTRAP_BUCKET..."
              aws s3api delete-bucket --bucket "$BOOTSTRAP_BUCKET" --region us-west-2
            else
              echo "Bootstrap assets bucket $BOOTSTRAP_BUCKET not found."
            fi

            echo "Checking for existing CDK bootstrap stack..."
            if aws cloudformation describe-stacks --stack-name CDKToolkit --region us-west-2 >/dev/null 2>&1; then
              echo "Found existing CDKToolkit stack. Deleting to ensure clean bootstrap with default qualifier..."
              aws cloudformation delete-stack --stack-name CDKToolkit --region us-west-2
              echo "Waiting for stack deletion to complete..."
              aws cloudformation wait stack-delete-complete --stack-name CDKToolkit --region us-west-2
              echo "Existing CDK bootstrap stack deleted successfully"
            fi
          fi

          if [ "$BOOTSTRAP_REQUIRED" -eq 1 ]; then
            echo "Bootstrapping environment $ACCOUNT/us-west-2 with default qualifier resources..."
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "Production bootstrap with OIDC role trust and default qualifier"
              cdk bootstrap aws://$ACCOUNT/us-west-2 \
                --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess \
                --trust arn:aws:iam::$ACCOUNT:role/GithubActionsProdRole
            else
              echo "Development bootstrap with default qualifier"
              cdk bootstrap aws://$ACCOUNT/us-west-2
            fi
          fi

      - name: Verify Bootstrap
        run: |
          set -e
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "Verifying CDK bootstrap for account $ACCOUNT"

          BOOTSTRAP_PARAMETER="/cdk-bootstrap/hnb659fds/version"
          BOOTSTRAP_BUCKET="cdk-hnb659fds-assets-${ACCOUNT}-us-west-2"

          echo "Checking for default qualifier bootstrap artifacts..."
          if aws ssm get-parameter --name "$BOOTSTRAP_PARAMETER" --region us-west-2 >/dev/null 2>&1; then
            echo "✅ CDK bootstrap verified successfully via SSM parameter"
          elif aws s3api head-bucket --bucket "$BOOTSTRAP_BUCKET" >/dev/null 2>&1; then
            echo "✅ CDK bootstrap assets bucket exists; treating environment as bootstrapped"
          else
            echo "❌ Unable to verify CDK bootstrap state (missing SSM parameter and assets bucket)"
            echo "Manual intervention required before continuing deployment"
            exit 1
          fi

      - name: Inspect changed files for deployment notes
        run: |
          set -euo pipefail
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            DIFF_BASE="HEAD~1"
          else
            git fetch origin development --depth=1 || true
            DIFF_BASE=$(git merge-base HEAD origin/development || echo "")
          fi

          if [ -n "${DIFF_BASE}" ]; then
            CHANGED_FILES="$(git diff --name-only "${DIFF_BASE}"...HEAD || git diff --name-only "${DIFF_BASE}" HEAD)"
          else
            CHANGED_FILES="$(git diff --name-only HEAD || true)"
          fi

          LAMBDA_CHANGED="false"
          AUTH_RELATED_CHANGED="false"
          if printf '%s\n' "${CHANGED_FILES}" | grep -q "^infrastructure/spaceport_cdk/lambda/"; then
            LAMBDA_CHANGED="true"
            echo "Lambda functions changed - will deploy branch-specific Lambda versions"
          fi

          if printf '%s\n' "${CHANGED_FILES}" | grep -Eq "^(infrastructure/spaceport_cdk/app\.py|infrastructure/spaceport_cdk/spaceport_cdk/deployment_context\.py|infrastructure/spaceport_cdk/spaceport_cdk/auth_stack\.py|infrastructure/spaceport_cdk/lambda/explore_public/|infrastructure/spaceport_cdk/lambda/model_delivery_admin/|infrastructure/cloudflare/spaces-thumbnail/|\.github/workflows/cdk-deploy\.yml|\.github/workflows/deploy-cloudflare-pages\.yml)"; then
            AUTH_RELATED_CHANGED="true"
          fi

          echo "LAMBDA_CHANGED=${LAMBDA_CHANGED}" >> "$GITHUB_ENV"
          echo "AUTH_RELATED_CHANGED=${AUTH_RELATED_CHANGED}" >> "$GITHUB_ENV"

      - name: Warn when auth-related changes stay read-only
        if: env.AUTH_RELATED_CHANGED == 'true' && env.DEPLOYMENT_CLASS == 'branch-preview' && env.DEPLOY_AUTH_STACK_EFFECTIVE != 'true'
        run: |
          message="This branch changed auth-related files but did not opt into shared auth deploy; preview is using existing staging auth."
          echo "::warning::${message}"
          {
            echo "### Auth preview note"
            echo ""
            echo "- ${message}"
            echo "- Add \`${AUTH_MARKER_RELATIVE_PATH}\` on this branch to opt into shared staging auth deploys."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy application stacks
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          export DEPLOY_AUTH_STACK_OVERRIDE="false"
          cdk deploy "${SPACEPORT_STACK_NAME}" "${ML_STACK_NAME}" \
            --require-approval never \
            --no-fail-on-empty-changeset \
            --context environment="${CDK_ENVIRONMENT_NAME}" \
            --context branch_name="${GITHUB_REF_NAME}" \
            --context deploy_auth_stack="false" \
            --context lambdaChanged="${LAMBDA_CHANGED}" \
            --context account=$ACCOUNT \
            --context region=us-west-2 \
            --parameters "${SPACEPORT_STACK_NAME}:GoogleMapsApiKey=${{ secrets.GOOGLE_MAPS_API_KEY }}"

      - name: Publish deployment outputs
        id: publish_outputs
        run: |
          set -euo pipefail

          get_output() {
            local stack_name="$1"
            local output_key="$2"
            local value
            value=$(aws cloudformation describe-stacks \
              --stack-name "$stack_name" \
              --query "Stacks[0].Outputs[?OutputKey=='${output_key}'].OutputValue" \
              --output text)
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "Missing required CloudFormation output ${output_key} on stack ${stack_name}" >&2
              exit 1
            fi
            printf '%s' "$value"
          }

          DRONE_PATH_API_URL="$(get_output "$SPACEPORT_STACK_NAME" "DronePathApiUrl")"
          FILE_UPLOAD_API_URL="$(get_output "$SPACEPORT_STACK_NAME" "FileUploadApiUrl")"
          ML_PIPELINE_API_URL="$(get_output "$ML_STACK_NAME" "MLPipelineApiUrl")"

          echo "Deployment class: $DEPLOYMENT_CLASS"
          echo "Branch ID: ${BRANCH_ID:-<shared>}"
          echo "Spaceport stack: $SPACEPORT_STACK_NAME"
          echo "ML stack: $ML_STACK_NAME"
          echo "Shared auth stack: $AUTH_STACK_NAME"
          echo "Drone Path API: $DRONE_PATH_API_URL"
          echo "File Upload API: $FILE_UPLOAD_API_URL"
          echo "ML Pipeline API: $ML_PIPELINE_API_URL"

          echo "drone_path_api_url=$DRONE_PATH_API_URL" >> "$GITHUB_OUTPUT"
          echo "file_upload_api_url=$FILE_UPLOAD_API_URL" >> "$GITHUB_OUTPUT"
          echo "ml_pipeline_api_url=$ML_PIPELINE_API_URL" >> "$GITHUB_OUTPUT"

  pull_request_diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infrastructure/spaceport_cdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: infrastructure/spaceport_cdk/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aws-cdk-lib==2.89.0 constructs==10.3.0 boto3==1.28.0 --no-deps
          pip install pytest jsii cattrs typeguard typing-extensions publication --no-deps
          pip install -e .
          npm install -g aws-cdk@2.89.0

      - name: CDK Diff
        run: |
          npx cdk diff \
            --context branch_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
            --context environment=staging
