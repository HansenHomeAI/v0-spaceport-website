name: 3DGS Segmented Unit Tests

on:
  pull_request:
    paths:
      - "infrastructure/containers/3dgs/**"
      - "infrastructure/spaceport_cdk/lambda/start_ml_job/lambda_function.py"
      - "infrastructure/spaceport_cdk/spaceport_cdk/ml_pipeline_stack.py"
      - "step_functions_def.json"
      - "tests/unit/test_segmented_3dgs.py"
  push:
    branches:
      - development
      - "codex/**"
    paths:
      - "infrastructure/containers/3dgs/**"
      - "infrastructure/spaceport_cdk/lambda/start_ml_job/lambda_function.py"
      - "infrastructure/spaceport_cdk/spaceport_cdk/ml_pipeline_stack.py"
      - "step_functions_def.json"
      - "tests/unit/test_segmented_3dgs.py"

jobs:
  segmented-3dgs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy plyfile pyyaml

      - name: Run segmented 3DGS unit tests
        run: python -m unittest tests.unit.test_segmented_3dgs
