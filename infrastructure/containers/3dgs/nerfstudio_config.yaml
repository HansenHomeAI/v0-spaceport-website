# NerfStudio Production Configuration
# Vincent Woo's Sutro Tower Methodology for High-Quality 3D Reconstruction
# Optimized for AWS ml.g5.xlarge (A10G GPU) deployment

# Model Configuration
model:
  variant: "splatfacto-w-light"      # Adds the lightweight background model for sky coverage
  sh_degree: 3                       # Foreground SH degree
  bilateral_processing: false        # Not used by splatfacto-w-light
  max_num_gaussians: 1500000         # Conservative limit for A10G GPU (16GB VRAM)
  rasterize_mode: "classic"          # Export classic-mode PLYs for SuperSplat compatibility
  use_scale_regularization: true     # Reduces oversized, spiky gaussians
  cull_alpha_thresh: 0.12            # Slightly more aggressive opacity culling for sky cleanup
  cull_scale_thresh: 0.35            # Cull oversized splats earlier to limit sky smear
  enable_bg_model: true
  enable_alpha_loss: true
  enable_robust_mask: true
  bg_sh_degree: 8
  appearance_embed_dim: 64
  never_mask_upper: 0.4

# Training Configuration
training:
  max_iterations: 30000              # Vincent's training duration
  target_psnr: 35.0                  # High quality target
  log_interval: 100                  # Frequent logging for monitoring
  vis_mode: "tensorboard"            # Use viewer for tiny proof runs to skip eval startup cost
  cache_images: ""                   # Optional NerfStudio datamanager cache target override
  cache_images_type: ""              # Optional NerfStudio datamanager cache dtype override
  dataloader_num_workers: null       # Optional NerfStudio datamanager worker override
  max_selected_images: 0             # Optional proof-run cap after manifest selection
  selection_stride: 1                # Optional proof-run stride after manifest selection
  review_images_per_bucket: 4        # Representative frames copied into outputs for seam/horizon review
  steps_per_eval_image: 100          # NerfStudio eval cadence
  steps_per_eval_all_images: 1000    # Full-image eval cadence
  steps_per_save: 2000               # Checkpoint cadence
  quit_on_train_completion: true     # Always exit cleanly in headless SageMaker jobs
  early_stopping: false             # Complete full training for quality
  
  # Quality thresholds
  min_iterations: 5000               # Minimum training duration
  convergence_patience: 2000         # Patience for convergence detection

# Tile / Scaffold Controls
tiling:
  training_mode: "monolithic"        # monolithic, global_scaffold, leaf_tile, or tiled_pipeline
  tile_manifest_path: ""
  view_bucket_manifest_path: ""
  tile_id: ""
  merge:
    mode: "strict_core"
  global_scaffold:
    max_images: 240
    frame_stride: 2
    max_iterations: 4000
    sh_degree: 1
    max_gauss_ratio: 4.0
  pipeline:
    max_tiles: 4
    tile_ids: ""
    include_scaffold: true
    include_merge: true
    resume_existing: true

# Hardware Optimization (A10G GPU specific)
hardware:
  gpu_memory_optimization: true      # Enable memory optimizations
  mixed_precision: true              # Use FP16 for memory efficiency
  gradient_checkpointing: false      # Disabled for A10G (sufficient memory)
  
  # GPU-specific settings
  num_gpus: 1                        # Single A10G GPU
  max_memory_gb: 14                  # Conservative memory limit (16GB total)

# Output Configuration
output:
  format: "ply"                      # SOGS-compatible PLY format
  include_spherical_harmonics: true  # Required for high quality
  compression_ready: true            # Prepare for SOGS compression
  background_skybox:
    enabled: true
    width: 2048
    height: 1024
    quality: 95
    appearance_mode: "auto_camera"
    selection_stride: 5
    selection_max_frames: 32
  floater_pruning:
    enabled: true
    min_views: 6
    top_region_ratio: 0.35
    top_view_fraction: 0.9
    min_sky_views: 2
    sky_min_luminance: 0.3
    sky_min_saturation: 0.08
    sky_blue_dominance_margin: 0.02
    max_opacity: 0.75
    max_color_distance: 0.18
    min_edge_support: 1
    patch_size: 9
    sky_color_pruning_enabled: false
    sky_color_min_sky_views: 1
    sky_color_max_color_distance: 0.35
  
  # Metadata inclusion
  include_training_metadata: true
  include_camera_parameters: true
  include_point_statistics: true

# Advanced Features (Vincent Woo's methodology)
advanced:
  # Bilateral guided radiance fields (Vincent's exposure correction)
  bilateral_guided:
    enabled: true
    bilateral_grid_resolution: 64
    bilateral_sigma: 0.1
    
  # Progressive training features
  progressive_training:
    enabled: true                    # Built-in NerfStudio progressive training
    sh_progression: true             # Progressive spherical harmonics
    
  # Quality enhancement
  quality_enhancement:
    anti_aliasing: true              # Enable anti-aliasing
    depth_consistency: true          # Enforce depth consistency
    normal_regularization: true      # Surface normal regularization

# Production Settings
production:
  # Error handling
  error_handling:
    strict_validation: true          # Strict input validation
    graceful_degradation: false      # Fail fast for production clarity
    detailed_logging: true           # Comprehensive logging
    
  # Performance monitoring
  monitoring:
    gpu_utilization: true            # Monitor GPU usage
    memory_tracking: true            # Track memory consumption
    timing_metrics: true             # Collect timing information
    
  # AWS SageMaker integration
  sagemaker:
    checkpoint_interval: 5000        # Save checkpoints regularly
    early_termination_support: true  # Support for spot instance interruption
    output_compression: false        # Keep uncompressed for quality

# Licensing and Compliance
licensing:
  framework: "NerfStudio + Splatfacto-W"
  license: "Apache 2.0"
  commercial_use: true
  attribution_required: true
  methodology: "Spaceport splatfacto-w-light skybox export"

# Version and Compatibility
version:
  config_version: "1.0.0"
  nerfstudio_version: "main"
  target_quality: "full_sky_background"
  last_updated: "2026-04-01"
